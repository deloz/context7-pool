name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/deloz/context7-pool

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish release image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect release version
        id: detect
        run: |
          set -euo pipefail

          old_version="$(
            git show HEAD^:.release-please-manifest.json 2>/dev/null \
              | jq -r '.backend // empty' 2>/dev/null \
              || true
          )"
          new_version="$(jq -r '.backend // empty' .release-please-manifest.json)"

          if [[ ! "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version must match X.Y.Z, got '$new_version'"
            exit 1
          fi

          if [ "$new_version" = "0.0.0" ] || [ "$old_version" = "$new_version" ]; then
            echo "No new release version detected."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${new_version}" >/dev/null 2>&1; then
            echo "Tag v${new_version} already exists; skipping image publish."
            exit 0
          fi

          cargo_version="$(
            cargo metadata --manifest-path backend/Cargo.toml --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name == "contextpool") | .version'
          )"

          if [ "$cargo_version" != "$new_version" ]; then
            echo "backend/Cargo.toml version ($cargo_version) does not match manifest version ($new_version)"
            exit 1
          fi

          major="${new_version%%.*}"
          minor="${new_version#*.}"
          minor="${minor%%.*}"

          {
            echo "publish=true"
            echo "version=${new_version}"
            echo "major=${major}"
            echo "minor=${minor}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.detect.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.detect.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.detect.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ steps.detect.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.major }}.${{ steps.detect.outputs.minor }}
            ${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.major }}

  release-please:
    name: Release Please
    needs:
      - test
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
